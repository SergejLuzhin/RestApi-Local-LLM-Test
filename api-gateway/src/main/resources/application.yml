server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Discovery locator отключён — маршруты определены вручную для полного контроля
      discovery:
        locator:
          enabled: false
      routes:
        # Маршрутизация запросов к аутентификации и управлению пользователями (Booking Service)
        # /api/user/** → Booking Service
        # RewritePath преобразует: /api/(?<segment>.+) → /${segment}
        # Пример: /api/user/register → /user/register, /api/user → /user
        - id: booking-auth-service
          uri: lb://booking-service
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        # Маршрутизация запросов к Booking Service (бронирования)
        # /api/bookings/** → Booking Service
        # RewritePath преобразует: /api/(?<segment>.+) → /${segment}
        # Пример: /api/bookings → /bookings, /api/booking/1 → /booking/1
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        # Маршрутизация запросов к Hotel Management Service
        # /api/hotels/** → Hotel Service
        # RewritePath преобразует: /api/(?<segment>.+) → /${segment}
        # Пример: /api/hotels → /hotels, /api/rooms → /rooms
        - id: hotel-hotels-service
          uri: lb://hotel-service
          predicates:
            - Path=/api/hotels/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        - id: hotel-rooms-service
          uri: lb://hotel-service
          predicates:
            - Path=/api/rooms/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
