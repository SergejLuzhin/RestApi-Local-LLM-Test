server:
  port: 8080

spring:
  application:
    name: api-gateway

spring.cloud:
  gateway:
    discovery:
      locator:
        enabled: true
        lower-case-service-id: true
    routes:
      - id: booking-service
        uri: lb://booking-service
        predicates:
          - Path=/api/bookings/**
        filters:
          - StripPrefix=1

      - id: hotel-service
        uri: lb://hotel-service
        predicates:
          - Path=/api/hotels/**
        filters:
          - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
